<body>
<header class="topbar">
  <svg class="topo" aria-hidden="true" viewBox="0 0 1440 200" preserveAspectRatio="xMidYMid slice">
    <defs><path id="contour" vector-effect="non-scaling-stroke" d="M -120 0 C -110 -70 -30 -95 40 -80 C 110 -65 140 -10 120 40 C 100 95 20 110 -40 90 C -100 70 -128 40 -120 0 Z"></path></defs>
    <g fill="none" stroke-width="1">
      <g transform="translate(1180 95)"><use href="#contour" transform="scale(2.4 2.4)"></use><use href="#contour" transform="scale(2.0 2.0)"></use><use href="#contour" transform="scale(1.65 1.65)"></use><use href="#contour" transform="scale(1.3 1.3)"></use><use href="#contour" transform="scale(0.95 0.95)"></use><use href="#contour" transform="scale(0.6 0.6)"></use><use href="#contour" transform="scale(0.3 0.3)"></use></g>
      <g transform="translate(560 160) rotate(-12)"><use href="#contour" transform="scale(2.4 1.2)"></use><use href="#contour" transform="scale(2.0 1.0)"></use><use href="#contour" transform="scale(1.6 0.8)"></use><use href="#contour" transform="scale(1.2 0.6)"></use><use href="#contour" transform="scale(0.8 0.4)"></use><use href="#contour" transform="scale(0.4 0.2)"></use></g>
      <g transform="translate(130 40) rotate(20)"><use href="#contour" transform="scale(1.9 1.3)"></use><use href="#contour" transform="scale(1.55 1.05)"></use><use href="#contour" transform="scale(1.2 0.8)"></use><use href="#contour" transform="scale(0.85 0.58)"></use><use href="#contour" transform="scale(0.5 0.35)"></use></g>
      <g transform="translate(860 15) rotate(35)"><use href="#contour" transform="scale(1.5 0.95)"></use><use href="#contour" transform="scale(1.15 0.72)"></use><use href="#contour" transform="scale(0.8 0.5)"></use><use href="#contour" transform="scale(0.45 0.28)"></use></g>
      <g transform="translate(1430 190) rotate(-20)"><use href="#contour" transform="scale(2.0 1.3)"></use><use href="#contour" transform="scale(1.6 1.05)"></use><use href="#contour" transform="scale(1.2 0.8)"></use><use href="#contour" transform="scale(0.8 0.52)"></use></g>
      <g transform="translate(300 190) rotate(8)"><use href="#contour" transform="scale(1.7 0.8)"></use><use href="#contour" transform="scale(1.3 0.6)"></use><use href="#contour" transform="scale(0.9 0.42)"></use><use href="#contour" transform="scale(0.5 0.24)"></use></g>
      <g transform="translate(1000 200) rotate(-5)"><use href="#contour" transform="scale(1.2 0.5)"></use><use href="#contour" transform="scale(0.8 0.33)"></use></g>
    </g>
  </svg>
  <div class="brand">
    <svg class="rose" role="img" aria-label="Limitless Diving compass rose" viewBox="0 0 200 200">
      <defs>
        <g id="pt-major"><polygon points="100,6 90,100 100,100" class="r-dark" style="fill: var(--shallows)"></polygon><polygon points="100,6 110,100 100,100" class="r-light" style="fill: var(--deep-ink)"></polygon></g>
        <polygon id="pt-minor" points="100,38 94,100 106,100" class="r-mid" style="fill: var(--thermo)"></polygon>
      </defs>
      <circle cx="100" cy="100" r="92" fill="none" class="r-ring" stroke-width="4"></circle>
      <circle cx="100" cy="100" r="76" fill="none" class="r-ring" stroke-width="2" stroke-dasharray="2 9"></circle>
      <use href="#pt-minor" transform="rotate(45 100 100)"></use><use href="#pt-minor" transform="rotate(135 100 100)"></use>
      <use href="#pt-minor" transform="rotate(225 100 100)"></use><use href="#pt-minor" transform="rotate(315 100 100)"></use>
      <use href="#pt-major"></use><use href="#pt-major" transform="rotate(90 100 100)"></use>
      <use href="#pt-major" transform="rotate(180 100 100)"></use><use href="#pt-major" transform="rotate(270 100 100)"></use>
      <circle cx="100" cy="100" r="9" class="r-hub" stroke-width="3"></circle>
    </svg>
    <div class="brand-text"><b>Limitless Diving</b></div>
  </div>
  <div class="head-right">
    <svg class="flag" role="img" aria-label="Diver down flag" viewBox="0 0 48 32"><rect width="48" height="32" fill="#D7263D"></rect><polygon points="0,0 9,0 48,26 48,32 39,32 0,6" fill="#FFFFFF"></polygon></svg>
    <a class="admin-login" id="admin-login" href="index.html#staff">Admin Log in</a>
  </div>
</header>
<svg class="wave" aria-hidden="true" viewBox="0 0 1440 18" preserveAspectRatio="none"><path d="M0 0 H1440 V6 C1380 14 1320 14 1260 6 C1200 -2 1140 -2 1080 6 C1020 14 960 14 900 6 C840 -2 780 -2 720 6 C660 14 600 14 540 6 C480 -2 420 -2 360 6 C300 14 240 14 180 6 C120 -2 60 -2 0 6 Z"></path></svg>
<div class="layout">
  <nav class="sidenav no-print" aria-label="Main">
    <div id="nav-modes" class="nav-modes"></div>
  </nav>
  <main id="main" class="shell"></main>
</div>
<input type="file" id="import-file" accept="application/json,.json" hidden>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

</body>
</html>
